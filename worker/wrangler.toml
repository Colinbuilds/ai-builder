name = "ai-toolkit-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Set from the GOOGLE_CLIENT_ID GitHub variable by the deploy workflow
GOOGLE_CLIENT_ID = "set-by-deploy-workflow"
# Where the web app is hosted (comma-separate several origins)
ALLOWED_ORIGIN = "https://colinbuilds.github.io"
APP_URL = "https://colinbuilds.github.io/ai-builder/app.html"
CLAUDE_MODEL = "claude-opus-5"
MONTHLY_RUN_LIMIT = "100"
