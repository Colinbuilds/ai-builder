name: Site checks

on:
  push:
    branches: [main]
    paths: ["site/**", "niches/**"]
  pull_request:
    paths: ["site/**", "niches/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test niches/test.mjs
      - run: node niches/build.mjs --check
