name: BTRpro checks

on:
  push:
    branches: [main]
    paths: ["btrpro/**", ".github/workflows/btrpro.yml"]
  pull_request:
    paths: ["btrpro/**", ".github/workflows/btrpro.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: btrpro
    env:
      DATABASE_URL: file:./dev.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: btrpro/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
