name: BTRpro checks

on:
  push:
    branches: [main]
    paths: ["btrpro/**", ".github/workflows/btrpro.yml"]
  pull_request:
    paths: ["btrpro/**", ".github/workflows/btrpro.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: btrpro
    env:
      DATABASE_URL: file:./dev.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: btrpro/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: btrpro
    env:
      DATABASE_URL: file:./dev.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: btrpro/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: btrpro/test-results/
          retention-days: 7
