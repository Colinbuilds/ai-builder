name: JobReceipts checks

on:
  push:
    branches: [main]
    paths: ["receipts/**"]
  pull_request:
    paths: ["receipts/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: receipts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node build.mjs --check
